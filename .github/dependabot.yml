version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3 # 1 day after pnpm's cutoff, prevent a race
    open-pull-requests-limit: 10 # Increase PR limit
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      react-ecosystem:
        patterns:
          - react
          - react-dom
          - "@types/react*"
      # Every npm update rewrites pnpm-lock.yaml, so separate PRs conflict
      # with each other as soon as one merges. Batch the rest of the minor
      # and patch bumps into one PR; majors still arrive one per PR.
      # A dependency goes to the first group it matches, so this stays last.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # Moves the meshtastic-sdk submodule to the head of the branch .gitmodules
  # names (meshtastic/meshtastic-sdk main). packages/sdk-kmp wraps the SDK's
  # API, so a bump that changes it fails the sdk-kmp build in CI; push the
  # facade changes onto the Dependabot branch instead of merging it red.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
