name: Create Protobuf Release for JSR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. v1.2.3). Used when manually dispatching."
        required: true
        type: string
      dry_run:
        description: "Don't actually publish to JSR (passes --dry-run)."
        required: false
        type: boolean
        default: false

# Least privilege by default; `publish-jsr` widens this for OIDC below.
permissions:
  contents: read

concurrency:
  group: release-protobufs-${{ inputs.version }}
  cancel-in-progress: false

env:
  PROTOBUF_DIR: ./packages/protobufs

jobs:
  codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show files exist
        run: |
          set -euxo pipefail
          ls -la $PROTOBUF_DIR/packages/ts || true
          cat $PROTOBUF_DIR/packages/ts/deno.json

      - name: Determine VERSION
        # Workflow inputs are untrusted text; never interpolate into the script body.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            echo "No 'version' input. Provide inputs.version." >&2
            exit 1
          fi
          # Reject anything that isn't a plain semver-ish tag before it reaches jq/git.
          if ! printf '%s' "$VERSION" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$VERSION' (expected e.g. v1.2.3)." >&2
            exit 1
          fi
          STRIPPED="${VERSION#v}"
          echo "VERSION=$STRIPPED" >> "$GITHUB_ENV"
          echo "Resolved VERSION=$STRIPPED"

      - name: Set Package Versions to current tag
        working-directory: ${{ env.PROTOBUF_DIR }}/packages/ts
        run: |
          set -euxo pipefail
          for f in deno.json; do
            test -f "$f"
            jq --arg version "${VERSION//\//-}" '
              walk(
                if type == "string" and test("__PACKAGE_VERSION__")
                then sub("__PACKAGE_VERSION__"; $version)
                else .
                end
              )
            ' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      # Pinned: a publishing workflow must not track a moving branch.
      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate code
        run: pnpm --filter @meshtastic/protobufs-ws build

      - name: Move generated .ts files and clean up
        run: |
          set -euxo pipefail
          SRC_DIR="$PROTOBUF_DIR/packages/ts/dist/meshtastic"
          DEST_DIR="$PROTOBUF_DIR/packages/ts/dist"

          if [ -d "$SRC_DIR" ]; then
            shopt -s nullglob
            ts_files=("$SRC_DIR"/*.ts)
            if [ ${#ts_files[@]} -gt 0 ]; then
              mv "$SRC_DIR"/*.ts "$DEST_DIR"/
            fi
            rm -rf "$SRC_DIR"
          else
            echo "Source directory not found: $SRC_DIR" >&2
            exit 1
          fi

          # Remove nanopb_pb.ts if present
          if [ -f "$DEST_DIR/nanopb_pb.ts" ]; then
            rm "$DEST_DIR/nanopb_pb.ts"
          fi

      - name: Copy license & README
        run: |
          cp LICENSE $PROTOBUF_DIR/packages/ts
          cp README.md $PROTOBUF_DIR/packages/ts

      - name: Upload TypeScript code
        uses: actions/upload-artifact@v7
        with:
          name: ts_code
          path: ${{ env.PROTOBUF_DIR }}/packages/ts

  publish-jsr:
    runs-on: ubuntu-24.04
    needs: codegen
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Download TypeScript code
        uses: actions/download-artifact@v8
        with:
          name: ts_code

      # Pinned to a release tag and a stable Deno line rather than @main + rc.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish to JSR
        run: |
          set -euxo pipefail
          FLAGS="--unstable-sloppy-imports"
          if [ "${DRY_RUN}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
            echo "Running publish in dry-run mode..."
          fi
          deno publish $FLAGS
