name: Pull Request CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # build-and-package is a required check, so it has to report on the merge
  # queue's temporary branch too, or every queued PR waits for it and times out.
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}-ci
  cancel-in-progress: true

env:
  CI: true

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'merge_group' || github.event.pull_request.draft == false }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup pnpm + Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          # Automatically uses the Node.js version specified in .nvmrc

      - name: Debug dependency state
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=${GITHUB_SHA}"
          git log --oneline -1
          pnpm --version
          node --version
          grep -n "meshtastic__protobufs" pnpm-lock.yaml || true
          grep -n "2.7.18" pnpm-lock.yaml || true
          grep -n "2.7.20" pnpm-lock.yaml || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 21 (for @meshtastic/sdk-kmp)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build @meshtastic/sdk-kmp
        run: pnpm --filter @meshtastic/sdk-kmp build

      - name: Run linter
        run: pnpm run lint

      - name: Check formatter
        run: pnpm run check
        continue-on-error: true

      - name: Run tests
        run: pnpm run test

      - name: Build web package
        run: pnpm --filter "./apps/web" run build
