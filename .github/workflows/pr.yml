name: Pull Request CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}-ci
  cancel-in-progress: true

env:
  CI: true

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.draft == false }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      # `pnpm run check` is `lint && format`, so calling it here would re-run the
      # linter. Call the formatter directly instead.
      #
      # TODO(ci): make this blocking. Non-blocking today because oxfmt currently
      # reports 611 of 624 files as unformatted (drift from the oxfmt 0.60 bump).
      # Run `pnpm run format:fix` as a standalone sweep commit, then delete
      # `continue-on-error` below.
      - name: Check formatting
        run: pnpm run format
        continue-on-error: true

      # TODO(ci): make this blocking. Non-blocking today because of ~25
      # pre-existing errors:
      #   - `better-result` no longer exports `ResultType` (widespread)
      #   - two copies of the protobufs types resolve at once (the workspace
      #     `packages/protobufs` build vs `@jsr/meshtastic__protobufs@2.7.20`),
      #     so structurally identical enums/messages are treated as unrelated
      # Delete `continue-on-error` once those are resolved.
      - name: Typecheck
        run: pnpm --filter "./apps/web" run typecheck
        continue-on-error: true

      - name: Run tests
        run: pnpm exec vitest run

      - name: Build web package
        run: pnpm --filter "./apps/web" run build
