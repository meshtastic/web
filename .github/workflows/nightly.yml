name: Nightly Release

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily
  workflow_dispatch: {} # allow manual runs too

permissions:
  contents: read
  packages: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # A scheduled nightly on an unchanged tree just republishes the same image.
  # Skip it unless something landed in the last day (manual runs always build).
  check-for-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for commits in the last 24h
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual run - building regardless of commit activity."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --format=%H)" ]; then
            echo "New commits found - building."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits in the last 24h - skipping nightly build."
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          fi

  nightly-build-and-push:
    needs: check-for-changes
    if: ${{ needs.check-for-changes.outputs.should-build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies (root)
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm exec vitest run

      - name: Build web package
        working-directory: apps/web
        run: pnpm run build

      - name: Package output
        working-directory: apps/web
        run: pnpm run package

      - name: Upload compressed build (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: web-build-nightly
          path: apps/web/dist/build.tar
          if-no-files-found: error

      - name: Compute tags and labels
        id: meta
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y%m%d)"
          ISO_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHORTSHA="$(git rev-parse --short=12 HEAD)"

          # Try to use latest release tag if it exists; fallback to package version; else date
          LATEST_TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$LATEST_TAG" ] && [ -f apps/web/package.json ]; then
            LATEST_TAG="v$(jq -r .version apps/web/package.json)"
          fi

          if [ -n "${LATEST_TAG:-}" ] && [ "$LATEST_TAG" != "vnull" ]; then
            IMMUTABLE="nightly-${LATEST_TAG}-${SHORTSHA}"
          else
            IMMUTABLE="nightly-${DATE}-${SHORTSHA}"
          fi

          # Outputs
          echo "moving_tag=nightly"            >> "$GITHUB_OUTPUT"
          echo "immutable_tag=${IMMUTABLE}"    >> "$GITHUB_OUTPUT"
          echo "all_tags=nightly ${IMMUTABLE}" >> "$GITHUB_OUTPUT"
          echo "created=${ISO_CREATED}"            >> "$GITHUB_OUTPUT"
          echo "Resolved tags: nightly and ${IMMUTABLE}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same builder as release-web.yml, so the nightly actually exercises the
      # release image build path instead of a parallel buildah/podman stack.
      - name: Build and push image (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/infra/Containerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.moving_tag }}
            ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.immutable_tag }}
          # image.source must be a URL for GHCR to link the package to this repo.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image URLs
        run: |
          echo "Moving tag:    ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.moving_tag }}"
          echo "Immutable tag: ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.immutable_tag }}"
