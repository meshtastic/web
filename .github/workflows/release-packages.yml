name: Release Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to release (comma-separated, or "all")'
        required: false
        default: "all"
      bump:
        description: "Semver bump (patch | minor | major)"
        required: false
        default: "patch"

permissions:
  contents: read

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # we commit the bumped versions back
      pull-requests: write # `gh pr create` for the version bump
      id-token: write # required for JSR OIDC and npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Workflow inputs are untrusted text; keep them out of every script body.
      INPUT_PACKAGES: ${{ inputs.packages }}
      INPUT_BUMP: ${{ inputs.bump }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve package list
        id: pkgs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${INPUT_PACKAGES}" = "all" ] || [ -z "${INPUT_PACKAGES}" ]; then
            mapfile -t TARGETS < <(ls -d packages/*)
          else
            IFS=',' read -ra TARGETS <<< "${INPUT_PACKAGES}"
            TARGETS=("${TARGETS[@]/#/packages/}")
          fi

          # Validate every target before anything mutates the tree, so a typo
          # fails fast instead of half-publishing.
          for dir in "${TARGETS[@]}"; do
            if [ ! -f "$dir/package.json" ]; then
              echo "::error::No package.json at '$dir' - check the 'packages' input." >&2
              exit 1
            fi
          done

          printf '%s\n' "${TARGETS[@]}" | paste -sd, - > targets.txt
          echo "list=$(cat targets.txt)" >> "$GITHUB_OUTPUT"
          echo "Targets: $(cat targets.txt)"

      - name: Bump package.json versions (no git tag)
        shell: bash
        env:
          TARGET_LIST: ${{ steps.pkgs.outputs.list }}
        run: |
          set -euo pipefail
          BUMP="${INPUT_BUMP}"
          case "$BUMP" in
            patch|minor|major) ;;
            *) echo "::error::bump must be patch, minor, or major (got '$BUMP')." >&2; exit 1 ;;
          esac
          IFS=',' read -ra TARGETS <<< "${TARGET_LIST}"
          for dir in "${TARGETS[@]}"; do
            if [ -f "$dir/package.json" ]; then
              echo "Bumping $dir -> $BUMP"
              (cd "$dir" && npm version "$BUMP" --no-git-tag-version --allow-same-version)
            fi
          done

      - name: Generate jsr.json from package.json (pkg-to-jsr)
        shell: bash
        env:
          TARGET_LIST: ${{ steps.pkgs.outputs.list }}
        run: |
          set -euo pipefail
          IFS=',' read -ra TARGETS <<< "${TARGET_LIST}"
          for dir in "${TARGETS[@]}"; do
            if [ -f "$dir/package.json" ]; then
              echo "Generating jsr.json for $dir"
              pnpm dlx pkg-to-jsr --root "$dir"
              # # Optional: show result
              # jq -C . "$dir/jsr.json" || cat "$dir/jsr.json"
            fi
          done

      - name: Commit version bumps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json packages/*/jsr.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # One branch per run: a fixed `version_bump` branch makes the second
          # run fail on `checkout -b` (or silently reuse a stale branch).
          BRANCH="release/version-bump-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "chore(release): bump package versions (${INPUT_BUMP})"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore(release): bump package versions (${INPUT_BUMP})" \
            --body "Automated version bump for NPM and JSR packages from run [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH"
          echo "Opened version bump PR from $BRANCH"

      - name: Build selected packages
        shell: bash
        env:
          TARGET_LIST: ${{ steps.pkgs.outputs.list }}
        run: |
          set -euo pipefail
          IFS=',' read -ra TARGETS <<< "${TARGET_LIST}"
          for dir in "${TARGETS[@]}"; do
            echo "Building $dir"
            pnpm --filter "./$dir" run build
          done

      - name: Publish to JSR (OIDC)
        shell: bash
        env:
          TARGET_LIST: ${{ steps.pkgs.outputs.list }}
        run: |
          set -euo pipefail
          IFS=',' read -ra TARGETS <<< "${TARGET_LIST}"
          for dir in "${TARGETS[@]}"; do
            if [ -f "$dir/jsr.json" ]; then
              echo "Publishing $dir to JSR via OIDC…"
              ( cd "$dir"
                [ -d dist ] || pnpm run build
                npx --yes jsr publish
              )
            fi
          done

      - name: Configure npm auth
        run: |
          pnpm config set //registry.npmjs.org/:_authToken="${NODE_AUTH_TOKEN}"
          pnpm config set registry https://registry.npmjs.org/

      - name: Publish to npm
        shell: bash
        env:
          TARGET_LIST: ${{ steps.pkgs.outputs.list }}
        run: |
          set -euo pipefail
          IFS=',' read -ra TARGETS <<< "${TARGET_LIST}"
          for dir in "${TARGETS[@]}"; do
            if [ -f "$dir/package.json" ]; then
              echo "Publishing $dir to npm…"
              ( cd "$dir"
                [ -d dist ] || pnpm run build
                # --provenance uses the job's OIDC token to publish a signed
                # build attestation alongside the tarball.
                npm publish --access public --provenance
              )
            fi
          done
