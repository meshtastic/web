name: Release Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to release (comma-separated, or "all")'
        required: false
        default: "all"
      bump:
        description: "Semver bump (patch | minor | major)"
        required: false
        default: "patch"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # we commit the bumped versions back
      id-token: write # required for JSR OIDC
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm + Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          # Automatically uses the Node.js version specified in .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve package list
        id: pkgs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.packages }}" = "all" ] || [ -z "${{ github.event.inputs.packages }}" ]; then
            mapfile -t ALL < <(ls -d packages/*)
          else
            IFS=',' read -ra ALL <<< "${{ github.event.inputs.packages }}"
            ALL=("${ALL[@]/#/packages/}")
          fi
          # Only publish packages that are not marked "private": true
          # (protobufs, sdk-kmp and ui are all private workspace packages).
          TARGETS=()
          for dir in "${ALL[@]}"; do
            if [ -f "$dir/package.json" ] && [ "$(node -p "require('./$dir/package.json').private === true")" = "false" ]; then
              TARGETS+=("$dir")
            else
              echo "Skipping $dir (private or no package.json)"
            fi
          done
          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "::error::No publishable (non-private) packages selected."
            exit 1
          fi
          printf '%s\n' "${TARGETS[@]}" | paste -sd, - > targets.txt
          echo "list=$(cat targets.txt)" >> "$GITHUB_OUTPUT"
          echo "Targets: $(cat targets.txt)"

      - name: Bump package.json versions (no git tag)
        shell: bash
        run: |
          set -euo pipefail
          BUMP="${{ github.event.inputs.bump }}"
          IFS=',' read -ra TARGETS <<< "${{ steps.pkgs.outputs.list }}"
          for dir in "${TARGETS[@]}"; do
            if [ -f "$dir/package.json" ]; then
              echo "Bumping $dir -> $BUMP"
              (cd "$dir" && npm version "$BUMP" --no-git-tag-version --allow-same-version)
            fi
          done

      - name: Generate jsr.json from package.json (pkg-to-jsr)
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra TARGETS <<< "${{ steps.pkgs.outputs.list }}"
          for dir in "${TARGETS[@]}"; do
            if [ -f "$dir/package.json" ]; then
              echo "Generating jsr.json for $dir"
              pnpm dlx pkg-to-jsr --root "$dir"
              # # Optional: show result
              # jq -C . "$dir/jsr.json" || cat "$dir/jsr.json"
            fi
          done

      - name: Commit version bumps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json packages/*/jsr.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git checkout -b version_bump
            git commit -m "chore(release): bump package versions (${{ github.event.inputs.bump }})"
            git push -u origin version_bump
            gh pr create --title "Bump package versions" --body "Bump versions of NPM and JSR packages" --base main --head version_bump
            echo "Pushed to branch version_bump"
          else
            echo "No changes to commit."
          fi

      - name: Build selected packages
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra TARGETS <<< "${{ steps.pkgs.outputs.list }}"
          for dir in "${TARGETS[@]}"; do
            echo "Building $dir"
            pnpm --filter "./$dir" run build
          done

      - name: Publish to JSR (OIDC)
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra TARGETS <<< "${{ steps.pkgs.outputs.list }}"
          for dir in "${TARGETS[@]}"; do
            if [ -f "$dir/jsr.json" ]; then
              echo "Publishing $dir to JSR via OIDC…"
              ( cd "$dir"
                [ -d dist ] || pnpm run build
                npx --yes jsr publish
              )
            fi
          done

      - name: Configure npm auth
        shell: bash
        run: |
          set -euo pipefail
          # pnpm/setup writes no ~/.npmrc and npm ignores pnpm's config, so write one for `npm publish`.
          # The token stays an unexpanded ${NODE_AUTH_TOKEN} placeholder; steps using npm auth must set it.
          npm config set --location=user registry https://registry.npmjs.org/
          # shellcheck disable=SC2016 # intentionally unexpanded
          echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc

      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm whoami --registry https://registry.npmjs.org/
          IFS=',' read -ra TARGETS <<< "${{ steps.pkgs.outputs.list }}"
          for dir in "${TARGETS[@]}"; do
            if [ -f "$dir/package.json" ]; then
              echo "Publishing $dir to npm…"
              ( cd "$dir"
                [ -d dist ] || pnpm run build
                npm publish --access public
              )
            fi
          done
