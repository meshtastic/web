name: Crowdin Upload Sources Action

on:
  push:
    # Monitor all .json files within the English locale directory.
    # This ensures the workflow triggers if any the English namespace files are modified on the main branch.
    # NOTE: path filters are relative to the repo root and must NOT start with "/",
    # otherwise the glob never matches and this workflow silently never runs.
    paths:
      - "apps/web/public/i18n/locales/en/*.json"
    branches: [main]
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

concurrency:
  group: crowdin-upload-sources
  cancel-in-progress: false

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Upload sources with Crowdin
        uses: crowdin/github-action@v2
        with:
          base_url: "https://meshtastic.crowdin.com/api/v2"
          config: "./apps/web/crowdin.yml"
          upload_sources: true
          upload_translations: false
          download_translations: false
          crowdin_branch_name: "main"

        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
