<!doctype html>
<!--
  Browser page translation (e.g. Chrome's) rewrites text nodes React owns,
  which crashes reconciliation with insertBefore/removeChild NotFoundError.
  The app ships its own translations, so opt out of machine translation.
-->
<html lang="en" data-theme="system" translate="no">
  <head>
    <meta name="google" content="notranslate" />
    <!-- CookieYes banner -->
    <%- cookieYesScript %>
    <!-- End of CookieYes banner -->
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <link rel="manifest" href="site.webmanifest" />
    <link rel="mask-icon" href="logo_black.svg" color="#67ea94" />
    <link rel="stylesheet" href="src/index.css" crossorigin="anonymous" />
    <meta name="theme-color" content="#67ea94" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Meshtastic Web Client" />
    <title><%- title %></title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script type="module" src="src/index.tsx"></script>
  </body>
</html>
