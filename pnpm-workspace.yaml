allowBuilds:
  "@tailwindcss/oxide": false
  "core-js": false
  esbuild: false
minimumReleaseAge: 2880 # package dependency library must be at least 2 days old
packages:
  - "packages/*"
  - "apps/*"

# Resolve every @meshtastic/protobufs dependency to the workspace package so
# the whole repo shares one copy of the generated types.
overrides:
  "@meshtastic/protobufs": "workspace:*"
