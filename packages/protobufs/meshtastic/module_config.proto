syntax = "proto3";

package meshtastic;

import "meshtastic/atak.proto";
import "meshtastic/channel.proto";
import "meshtastic/config.proto";
import "meshtastic/field_metadata.proto";

option csharp_namespace = "Meshtastic.Protobufs";
option go_package = "github.com/meshtastic/go/generated";
option java_outer_classname = "ModuleConfigProtos";
option java_package = "org.meshtastic.proto";
option swift_prefix = "";

/*
 * Module Config
 */
message ModuleConfig {
  /*
   * MQTT Client Config
   */
  message MQTTConfig {
    /*
     * If a meshtastic node is able to reach the internet it will normally attempt to gateway any channels that are marked as
     * is_uplink_enabled or is_downlink_enabled.
     */
    bool enabled = 1 [(meshtastic.field_metadata) = {
      label: "MQTT Enabled"
      description: "Enable MQTT gateway"
    }];

    /*
     * The server to use for our MQTT global message gateway feature.
     * If not set, the default server will be used
     */
    string address = 2 [(meshtastic.field_metadata) = {
      label: "Address"
      description: "MQTT server address"
    }];

    /*
     * MQTT username to use (most useful for a custom MQTT server).
     * If using a custom server, this will be honoured even if empty.
     * If using the default server, this will only be honoured if set, otherwise the device will use the default username
     */
    string username = 3 [(meshtastic.field_metadata) = {
      label: "Username"
      description: "MQTT username"
    }];

    /*
     * MQTT password to use (most useful for a custom MQTT server).
     * If using a custom server, this will be honoured even if empty.
     * If using the default server, this will only be honoured if set, otherwise the device will use the default password
     */
    string password = 4 [(meshtastic.field_metadata) = {
      label: "Password"
      description: "MQTT password"
    }];

    /*
     * Whether to send encrypted or decrypted packets to MQTT.
     * This parameter is only honoured if you also set server
     * (the default official mqtt.meshtastic.org server can handle encrypted packets)
     * Decrypted packets may be useful for external systems that want to consume meshtastic packets
     */
    bool encryption_enabled = 5 [(meshtastic.field_metadata) = {
      label: "Encryption Enabled"
      description: "Send encrypted packets to MQTT"
    }];

    /*
     * Deprecated: JSON packet support on MQTT was removed, and this field is ignored.
     */
    bool json_enabled = 6 [
      deprecated = true,
      (meshtastic.field_metadata) = {deprecated_since: "2.8.0"}
    ];

    /*
     * If true, we attempt to establish a secure connection using TLS
     */
    bool tls_enabled = 7 [(meshtastic.field_metadata) = {
      label: "TLS Enabled"
      description: "TLS is required for the public Meshtastic MQTT server."
    }];

    /*
     * The root topic to use for MQTT messages. Default is "msh".
     * This is useful if you want to use a single MQTT server for multiple meshtastic networks and separate them via ACLs
     */
    string root = 8 [(meshtastic.field_metadata) = {
      label: "Root Topic"
      description: "MQTT root topic"
    }];

    /*
     * If true, we can use the connected phone / client to proxy messages to MQTT instead of a direct connection
     */
    bool proxy_to_client_enabled = 9 [(meshtastic.field_metadata) = {
      label: "MQTT Client Proxy"
      description: "Utilizes the network connection on your phone to connect to MQTT."
    }];

    /*
     * If true, we will periodically report unencrypted information about our node to a map via MQTT
     */
    bool map_reporting_enabled = 10 [(meshtastic.field_metadata) = {
      label: "Map Reporting"
      description: "Your node will periodically send an unencrypted map report packet to the configured MQTT server, this includes id, short and long name, approximate location, hardware model, role, firmware version, LoRa region, modem preset and primary channel name."
    }];

    /*
     * Settings for reporting information about our node to a map via MQTT
     */
    MapReportSettings map_report_settings = 11;
  }

  /*
   * Settings for reporting unencrypted information about our node to a map via MQTT
   */
  message MapReportSettings {
    /*
     * How often we should report our info to the map (in seconds)
     */
    uint32 publish_interval_secs = 1 [(meshtastic.field_metadata) = {
      label: "Map Publish Interval"
      description: "How often a map report is published."
      unit: "s"
    }];

    /*
     * Bits of precision for the location sent (default of 32 is full precision).
     */
    uint32 position_precision = 2;

    /*
     * Whether we have opted-in to report our location to the map
     */
    bool should_report_location = 3 [(meshtastic.field_metadata) = {
      label: "Report Location"
      description: "I have read and understand the above. I voluntarily consent to the unencrypted transmission of my node data via MQTT."
      since_firmware: "2.6.8"
    }];
  }

  /*
   * RemoteHardwareModule Config
   */
  message RemoteHardwareConfig {
    /*
     * Whether the Module is enabled
     */
    bool enabled = 1;

    /*
     * Whether the Module allows consumers to read / write to pins not defined in available_pins
     */
    bool allow_undefined_pin_access = 2;

    /*
     * Exposes the available pins to the mesh for reading and writing
     */
    repeated RemoteHardwarePin available_pins = 3;
  }

  /*
   * NeighborInfoModule Config
   */
  message NeighborInfoConfig {
    /*
     * Whether the Module is enabled
     */
    bool enabled = 1 [(meshtastic.field_metadata) = {
      label: "Neighbor Info Enabled"
      description: "Enable neighbor info broadcasting. Periodically sends information about directly-heard neighbors to help visualize mesh topology."
    }];

    /*
     * Interval in seconds of how often we should try to send our
     * Neighbor Info (minimum is 14400, i.e., 4 hours)
     */
    uint32 update_interval = 2 [(meshtastic.field_metadata) = {
      label: "Update Interval"
      unit: "s"
      description: "How often to broadcast neighbor info."
    }];

    /*
     * Whether in addition to sending it to MQTT and the PhoneAPI, our NeighborInfo should be transmitted over LoRa.
     * Note that this is not available on a channel with default key and name.
     */
    bool transmit_over_lora = 3 [(meshtastic.field_metadata) = {
      label: "Transmit over LoRa"
      description: "Whether to transmit neighbor info over LoRa in addition to MQTT and PhoneAPI. Not available on channels with default key and name."
    }];
  }

  /*
   * Detection Sensor Module Config
   */
  message DetectionSensorConfig {
    enum TriggerType {
      // Event is triggered if pin is low
      LOGIC_LOW = 0 [(meshtastic.enum_value_metadata) = {label: "Low"}];
      // Event is triggered if pin is high
      LOGIC_HIGH = 1 [(meshtastic.enum_value_metadata) = {label: "High"}];
      // Event is triggered when pin goes high to low
      FALLING_EDGE = 2 [(meshtastic.enum_value_metadata) = {label: "Falling Edge"}];
      // Event is triggered when pin goes low to high
      RISING_EDGE = 3 [(meshtastic.enum_value_metadata) = {label: "Rising Edge"}];
      // Event is triggered on every pin state change, low is considered to be
      // "active"
      EITHER_EDGE_ACTIVE_LOW = 4 [(meshtastic.enum_value_metadata) = {label: "Either Edge Low"}];
      // Event is triggered on every pin state change, high is considered to be
      // "active"
      EITHER_EDGE_ACTIVE_HIGH = 5 [(meshtastic.enum_value_metadata) = {label: "Either Edge High"}];
    }
    /*
     * Whether the Module is enabled
     */
    bool enabled = 1 [(meshtastic.field_metadata) = {
      label: "Detection Sensor Enabled"
      description: "Enables the detection sensor module, it needs to be enabled on both the node with the sensor, and any nodes that you want to receive detection sensor text messages or view the detection sensor log and chart."
    }];

    /*
     * Interval in seconds of how often we can send a message to the mesh when a
     * trigger event is detected
     */
    uint32 minimum_broadcast_secs = 2 [(meshtastic.field_metadata) = {
      label: "Minimum time between detection broadcasts"
      unit: "s"
      description: "Minimum time between detection broadcasts."
    }];

    /*
     * Interval in seconds of how often we should send a message to the mesh
     * with the current state regardless of trigger events When set to 0, only
     * trigger events will be broadcasted Works as a sort of status heartbeat
     * for peace of mind
     */
    uint32 state_broadcast_secs = 3 [(meshtastic.field_metadata) = {
      label: "State Broadcast Interval"
      unit: "s"
      description: "How often to send the detection sensor state to the mesh, whether or not anything was detected."
    }];

    /*
     * Send ASCII bell with alert message
     * Useful for triggering ext. notification on bell
     */
    bool send_bell = 4 [(meshtastic.field_metadata) = {
      label: "Send Bell"
      description: "Send ASCII bell with alert message. Useful for triggering external notification on bell."
    }];

    /*
     * Friendly name used to format message sent to mesh
     * Example: A name "Motion" would result in a message "Motion detected"
     * Maximum length of 20 characters
     */
    string name = 5 [(meshtastic.field_metadata) = {
      label: "Name"
      description: "Sensor name for mesh messages"
    }];

    /*
     * GPIO pin to monitor for state changes
     */
    uint32 monitor_pin = 6 [(meshtastic.field_metadata) = {
      label: "GPIO Pin to monitor"
      description: "GPIO pin watched for state changes."
    }];

    /*
     * The type of trigger event to be used
     */
    TriggerType detection_trigger_type = 7 [(meshtastic.field_metadata) = {
      label: "TriggerType"
      description: "Type of trigger event"
    }];

    /*
     * Whether or not use INPUT_PULLUP mode for GPIO pin
     * Only applicable if the board uses pull-up resistors on the pin
     */
    bool use_pullup = 8 [(meshtastic.field_metadata) = {
      label: "Uses pullup resistor"
      description: "Whether or not use INPUT_PULLUP mode for GPIO pin. Only applicable if the board uses pull-up resistors on the pin"
    }];
  }

  /*
   * Audio Config for codec2 voice
   */
  message AudioConfig {
    /*
     * Baudrate for codec2 voice
     */
    enum Audio_Baud {
      CODEC2_DEFAULT = 0 [(meshtastic.enum_value_metadata) = {label: "Default"}];
      CODEC2_3200 = 1 [(meshtastic.enum_value_metadata) = {label: "3200 bps"}];
      CODEC2_2400 = 2 [(meshtastic.enum_value_metadata) = {label: "2400 bps"}];
      CODEC2_1600 = 3 [(meshtastic.enum_value_metadata) = {label: "1600 bps"}];
      CODEC2_1400 = 4 [(meshtastic.enum_value_metadata) = {label: "1400 bps"}];
      CODEC2_1300 = 5 [(meshtastic.enum_value_metadata) = {label: "1300 bps"}];
      CODEC2_1200 = 6 [(meshtastic.enum_value_metadata) = {label: "1200 bps"}];

      /*
       * Removed from libcodec2 upstream. A device configured to one of these
       * falls back to CODEC2_700C.
       */
      CODEC2_700 = 7 [deprecated = true];
      CODEC2_700B = 8 [deprecated = true];

      /*
       * Replaces CODEC2_700. Default for new configurations.
       */
      CODEC2_700C = 9 [(meshtastic.enum_value_metadata) = {label: "700C bps"}];

      /*
       * Lowest rate, and the only one usable on slower modem presets.
       */
      CODEC2_450 = 10 [(meshtastic.enum_value_metadata) = {label: "450 bps"}];
    }

    /*
     * Whether Audio is enabled
     */
    bool codec2_enabled = 1 [(meshtastic.field_metadata) = {
      label: "Codec2 Enabled"
      description: "Enable Codec2 audio encoding/decoding for voice communication over the mesh."
    }];

    /*
     * PTT Pin
     */
    uint32 ptt_pin = 2 [(meshtastic.field_metadata) = {
      label: "PTT Pin"
      description: "Push-to-talk GPIO pin number."
    }];

    /*
     * The codec2 bitrate to encode at. Sample rate is always 8 kHz.
     */
    Audio_Baud bitrate = 3 [(meshtastic.field_metadata) = {
      label: "Bitrate"
      description: "The Codec2 bitrate to use. The sample rate is always 8 kHz. Lower bitrates use less bandwidth but reduce audio quality."
    }];

    /*
     * I2S Word Select
     */
    uint32 i2s_ws = 4 [(meshtastic.field_metadata) = {label: "I2S WS"}];

    /*
     * I2S Data IN
     */
    uint32 i2s_sd = 5 [(meshtastic.field_metadata) = {label: "I2S SD"}];

    /*
     * I2S Data OUT
     */
    uint32 i2s_din = 6 [(meshtastic.field_metadata) = {label: "I2S DIN"}];

    /*
     * I2S Clock
     */
    uint32 i2s_sck = 7 [(meshtastic.field_metadata) = {label: "I2S SCK"}];
  }

  /*
   * Config for the Paxcounter Module
   */
  message PaxcounterConfig {
    /*
     * Enable the Paxcounter Module
     */
    bool enabled = 1 [(meshtastic.field_metadata) = {
      label: "PAX Counter Enabled"
      description: "When enabled the PAX Counter module counts the number of people passing by using WiFi and Bluetooth. Both WiFI and Bluetooth must be disabled for PAX counter to work."
    }];

    /*
     * Interval in seconds of how often we should try to send our
     * metrics to the mesh
     */

    uint32 paxcounter_update_interval = 2 [(meshtastic.field_metadata) = {
      label: "Update Interval"
      unit: "s"
      description: "How often we can send a message to the mesh when people are detected."
    }];

    /*
     * WiFi RSSI threshold. Defaults to -80
     */
    int32 wifi_threshold = 3 [(meshtastic.field_metadata) = {
      label: "WiFi Threshold"
      description: "RSSI threshold for counting WiFi devices."
      unit: "dBm"
    }];

    /*
     * BLE RSSI threshold. Defaults to -80
     */
    int32 ble_threshold = 4 [(meshtastic.field_metadata) = {
      label: "BLE Threshold"
      description: "RSSI threshold for counting BLE devices."
      unit: "dBm"
    }];
  }

  /*
   * Config for the Traffic Management module.
   * Provides packet inspection and traffic shaping to help reduce channel utilization.
   * Every field uses the proto3 zero value to mean "disabled"; there is no
   * "use the firmware default" sentinel. Firmware installs its own defaults when it
   * first creates this config, and a client that writes 0 turns that feature off.
   */
  message TrafficManagementConfig {
    // Tags 1, 2, 3, 5, 7, 10, 12, 13, 14 were bool toggle fields removed in favour
    // of the "non-zero implies enabled" convention on their companion uint32 fields.
    // Tag 3 (position_precision_bits) was removed because precision is now derived
    // from the channel's own position_precision ceiling.
    // None of these tags ever shipped in a stable release.
    reserved 1, 2, 3, 5, 7, 10, 12, 13, 14;
    reserved "enabled", "position_dedup_enabled", "position_precision_bits", "nodeinfo_direct_response", "rate_limit_enabled", "drop_unknown_enabled", "exhaust_hop_telemetry", "exhaust_hop_position", "router_preserve_hops";

    /*
     * Minimum interval in seconds between position updates from the same node.
     * A non-zero value implicitly enables the suppression window; 0 disables it.
     * Firmware default: 21600 (6 hours), installed when this config is first created.
     */
    uint32 position_min_interval_secs = 4 [(meshtastic.field_metadata) = {
      label: "Minimum Position Interval"
      unit: "s"
      description: "Positions from the same node arriving sooner than this are dropped."
    }];

    /*
     * Maximum hop distance from the requestor at which direct NodeInfo responses
     * are served from the local cache. A non-zero value implicitly enables direct
     * response; 0 disables it.
     */
    uint32 nodeinfo_direct_response_max_hops = 6 [(meshtastic.field_metadata) = {
      label: "Direct NodeInfo Max Hops"
      description: "Only answer requestors within this many hops."
    }];

    /*
     * Time window in seconds for per-node rate limiting.
     * A non-zero value implicitly enables rate limiting; 0 disables it.
     */
    uint32 rate_limit_window_secs = 8 [(meshtastic.field_metadata) = {
      label: "Rate Limit Window"
      unit: "s"
      description: "The time window packets are counted over."
    }];

    /*
     * Maximum packets allowed per node within the rate limit window.
     * A non-zero value implicitly enables rate limiting; 0 disables it.
     */
    uint32 rate_limit_max_packets = 9 [(meshtastic.field_metadata) = {
      label: "Rate Limit Max Packets"
      description: "The most packets one node may send per window."
    }];

    /*
     * Maximum unknown/undecryptable packets per rate window before the source
     * is dropped. A non-zero value implicitly enables unknown-packet filtering;
     * 0 disables it.
     */
    uint32 unknown_packet_threshold = 11 [(meshtastic.field_metadata) = {
      label: "Unknown Packet Threshold"
      description: "How many per window before the sender is dropped."
    }];
  }

  /*
   * Serial Config
   */
  message SerialConfig {
    /*
     * TODO: REPLACE
     */
    enum Serial_Baud {
      BAUD_DEFAULT = 0 [(meshtastic.enum_value_metadata) = {label: "Default"}];
      BAUD_110 = 1 [(meshtastic.enum_value_metadata) = {label: "110 Baud"}];
      BAUD_300 = 2 [(meshtastic.enum_value_metadata) = {label: "300 Baud"}];
      BAUD_600 = 3 [(meshtastic.enum_value_metadata) = {label: "600 Baud"}];
      BAUD_1200 = 4 [(meshtastic.enum_value_metadata) = {label: "1200 Baud"}];
      BAUD_2400 = 5 [(meshtastic.enum_value_metadata) = {label: "2400 Baud"}];
      BAUD_4800 = 6 [(meshtastic.enum_value_metadata) = {label: "4800 Baud"}];
      BAUD_9600 = 7 [(meshtastic.enum_value_metadata) = {label: "9600 Baud"}];
      BAUD_19200 = 8 [(meshtastic.enum_value_metadata) = {label: "19200 Baud"}];
      BAUD_38400 = 9 [(meshtastic.enum_value_metadata) = {label: "38400 Baud"}];
      BAUD_57600 = 10 [(meshtastic.enum_value_metadata) = {label: "57600 Baud"}];
      BAUD_115200 = 11 [(meshtastic.enum_value_metadata) = {label: "115200 Baud"}];
      BAUD_230400 = 12 [(meshtastic.enum_value_metadata) = {label: "230400 Baud"}];
      BAUD_460800 = 13 [(meshtastic.enum_value_metadata) = {label: "460800 Baud"}];
      BAUD_576000 = 14 [(meshtastic.enum_value_metadata) = {label: "576000 Baud"}];
      BAUD_921600 = 15 [(meshtastic.enum_value_metadata) = {label: "921600 Baud"}];
    }

    /*
     * TODO: REPLACE
     */
    enum Serial_Mode {
      DEFAULT = 0 [(meshtastic.enum_value_metadata) = {label: "Default"}];
      SIMPLE = 1 [(meshtastic.enum_value_metadata) = {label: "Simple"}];
      PROTO = 2 [(meshtastic.enum_value_metadata) = {label: "Protobufs"}];
      TEXTMSG = 3 [(meshtastic.enum_value_metadata) = {label: "Text Message"}];
      NMEA = 4 [(meshtastic.enum_value_metadata) = {label: "NMEA Positions"}];
      // NMEA messages specifically tailored for CalTopo
      CALTOPO = 5 [(meshtastic.enum_value_metadata) = {label: "CALTOPO"}];
      // Ecowitt WS85 weather station
      WS85 = 6;
      // VE.Direct is a serial protocol used by Victron Energy products
      // https://beta.ivc.no/wiki/index.php/Victron_VE_Direct_DIY_Cable
      VE_DIRECT = 7;
      // Used to configure and view some parameters of MeshSolar.
      // https://heltec.org/project/meshsolar/
      MS_CONFIG = 8;
      // Logs mesh traffic to the serial pins, ideal for logging via openLog or similar.
      LOG = 9; // includes other packets
      LOGTEXT = 10; // only text (channel & DM)
    }

    /*
     * Preferences for the SerialModule
     */
    bool enabled = 1 [(meshtastic.field_metadata) = {
      label: "Serial Enabled"
      description: "Enable serial module"
    }];

    /*
     * TODO: REPLACE
     */
    bool echo = 2 [(meshtastic.field_metadata) = {
      label: "Echo"
      description: "If set, any packets you send will be echoed back to your device."
    }];

    /*
     * RX pin (should match Arduino gpio pin number)
     */
    uint32 rxd = 3 [(meshtastic.field_metadata) = {
      label: "Receive data (rxd) GPIO pin"
      description: "RX pin number"
    }];

    /*
     * TX pin (should match Arduino gpio pin number)
     */
    uint32 txd = 4 [(meshtastic.field_metadata) = {
      label: "Transmit data (txd) GPIO pin"
      description: "TX pin number"
    }];

    /*
     * Serial baud rate
     */
    Serial_Baud baud = 5 [(meshtastic.field_metadata) = {
      label: "Baud"
      description: "Serial baud rate"
    }];

    /*
     * TODO: REPLACE
     */
    uint32 timeout = 6 [(meshtastic.field_metadata) = {
      label: "Timeout"
      description: "The amount of time to wait before we consider your packet as done."
    }];

    /*
     * Mode for serial module operation
     */
    Serial_Mode mode = 7 [(meshtastic.field_metadata) = {
      label: "Mode"
      description: "Serial module operation mode"
    }];

    /*
     * Overrides the platform's defacto Serial port instance to use with Serial module config settings
     * This is currently only usable in output modes like NMEA / CalTopo and may behave strangely or not work at all in other modes
     * Existing logging over the Serial Console will still be present
     */
    bool override_console_serial_port = 8;
  }

  /*
   * External Notifications Config
   */
  message ExternalNotificationConfig {
    /*
     * Enable the ExternalNotificationModule
     */
    bool enabled = 1 [(meshtastic.field_metadata) = {
      label: "External Notification Enabled"
      description: "Enable external notifications"
    }];

    /*
     * When using in On/Off mode, keep the output on for this many
     * milliseconds. Default 1000ms (1 second).
     */
    uint32 output_ms = 2 [(meshtastic.field_metadata) = {
      label: "GPIO Output Duration"
      unit: "ms"
      description: "In GPIO mode, how long to keep the output on."
    }];

    /*
     * Define the output pin GPIO setting Defaults to
     * EXT_NOTIFY_OUT if set for the board.
     * In standalone devices this pin should drive the LED to match the UI.
     */
    uint32 output = 3 [(meshtastic.field_metadata) = {
      label: "Output pin GPIO"
      description: "GPIO pin driven on notification. Defaults to the board's EXT_NOTIFY_OUT pin."
    }];

    /*
     * Optional: Define a secondary output pin for a vibra motor
     * This is used in standalone devices to match the UI.
     */
    uint32 output_vibra = 8 [(meshtastic.field_metadata) = {
      label: "Output pin vibra GPIO"
      description: "Vibration motor output pin"
    }];

    /*
     * Optional: Define a tertiary output pin for an active buzzer
     * This is used in standalone devices to to match the UI.
     */
    uint32 output_buzzer = 9 [(meshtastic.field_metadata) = {
      label: "Output pin buzzer GPIO"
      description: "Buzzer output pin"
    }];

    /*
     * IF this is true, the 'output' Pin will be pulled active high, false
     * means active low.
     */
    bool active = 4 [(meshtastic.field_metadata) = {
      label: "Active"
      description: "If enabled, the 'output' Pin will be pulled active high, disabled means active low."
    }];

    /*
     * True: Alert when a text message arrives (output)
     */
    bool alert_message = 5 [(meshtastic.field_metadata) = {
      label: "Alert when receiving a message"
      description: "Alert on incoming message"
    }];

    /*
     * True: Alert when a text message arrives (output_vibra)
     */
    bool alert_message_vibra = 10 [(meshtastic.field_metadata) = {
      label: "Vibra Motor Alert"
      description: "Alert GPIO vibra motor when receiving a message"
    }];

    /*
     * True: Alert when a text message arrives (output_buzzer)
     */
    bool alert_message_buzzer = 11 [(meshtastic.field_metadata) = {
      label: "Alert GPIO buzzer when receiving a message"
      description: "Buzz on incoming message"
    }];

    /*
     * True: Alert when the bell character is received (output)
     */
    bool alert_bell = 6 [(meshtastic.field_metadata) = {
      label: "Alert when receiving a bell"
      description: "Alert on bell character"
    }];

    /*
     * True: Alert when the bell character is received (output_vibra)
     */
    bool alert_bell_vibra = 12 [(meshtastic.field_metadata) = {
      label: "Alert GPIO vibra motor when receiving a bell"
      description: "Vibrate on bell character"
    }];

    /*
     * True: Alert when the bell character is received (output_buzzer)
     */
    bool alert_bell_buzzer = 13 [(meshtastic.field_metadata) = {
      label: "Alert GPIO buzzer when receiving a bell"
      description: "Buzz on bell character"
    }];

    /*
     * use a PWM output instead of a simple on/off output. This will ignore
     * the 'output', 'output_ms' and 'active' settings and use the
     * device.buzzer_gpio instead.
     */
    bool use_pwm = 7 [(meshtastic.field_metadata) = {
      label: "Use PWM Buzzer"
      description: "Use a PWM output (like the RAK Buzzer) for tunes instead of an on/off output. This will ignore the output, output duration and active settings and use the device config buzzer GPIO option instead."
    }];

    /*
     * The notification will toggle with 'output_ms' for this time of seconds.
     * Default is 0 which means don't repeat at all. 60 would mean blink
     * and/or beep for 60 seconds
     */
    uint32 nag_timeout = 14 [(meshtastic.field_metadata) = {
      label: "Nag Timeout"
      description: "How long the notification lasts."
      unit: "s"
    }];

    /*
     * When true, enables devices with native I2S audio output to use the RTTTL over speaker like a buzzer
