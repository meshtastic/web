syntax = "proto3";

package meshtastic;

import "meshtastic/device_ui.proto";
import "meshtastic/field_metadata.proto";

option csharp_namespace = "Meshtastic.Protobufs";
option go_package = "github.com/meshtastic/go/generated";
option java_outer_classname = "ConfigProtos";
option java_package = "org.meshtastic.proto";
option swift_prefix = "";

message Config {
  /*
   * Configuration
   */
  message DeviceConfig {
    /*
     * Defines the device's role on the Mesh network
     */
    enum Role {
      /*
       * Description: App connected or stand alone messaging device.
       * Technical Details: Default Role
       */
      CLIENT = 0 [(meshtastic.enum_value_metadata) = {
        label: "Client"
        description: "App connected or stand alone messaging device."
      }];
      /*
       *  Description: Device that does not forward packets from other devices.
       */
      CLIENT_MUTE = 1 [(meshtastic.enum_value_metadata) = {
        label: "Client Mute"
        description: "Device that does not forward packets from other devices."
      }];

      /*
       * Description: Infrastructure node for extending network coverage by relaying messages. Visible in Nodes list.
       * Technical Details: Mesh packets will prefer to be routed over this node. This node will not be used by client apps.
       *   The wifi radio and the oled screen will be put to sleep.
       *   This mode may still potentially have higher power usage due to it's preference in message rebroadcasting on the mesh.
       */
      ROUTER = 2 [(meshtastic.enum_value_metadata) = {
        label: "Router"
        description: "Infrastructure node on a tower or mountain top only.  Not to be used for roofs or mobile nodes.  Needs exceptional coverage. Visible in Nodes list."
      }];

      /*
       * Description: Combination of both ROUTER and CLIENT. Not for mobile devices.
       * Deprecated in v2.3.15 because improper usage is impacting public meshes: Use ROUTER or CLIENT instead.
       */

      ROUTER_CLIENT = 3 [
        deprecated = true,
        (meshtastic.enum_value_metadata) = {label: "Router Client"}
      ];

      /*
       * Description: Infrastructure node for extending network coverage by relaying messages with minimal overhead. Not visible in Nodes list.
       * Technical Details: Mesh packets will simply be rebroadcasted over this node. Nodes configured with this role will not originate NodeInfo, Position, Telemetry
       *   or any other packet type. They will simply rebroadcast any mesh packets on the same frequency, channel num, spread factor, and coding rate.
       * Deprecated in v2.7.11 because it creates "holes" in the mesh rebroadcast chain.
       */
      REPEATER = 4 [
        deprecated = true,
        (meshtastic.enum_value_metadata) = {
          label: "Repeater"
          description: "Deprecated infrastructure role that creates gaps in the mesh rebroadcast chain. Switch this node to a Router-based role (Router or Router Late)."
        }
      ];

      /*
       * Description: Broadcasts GPS position packets as priority.
       * Technical Details: Position Mesh packets will be prioritized higher and sent more frequently by default.
       *   When used in conjunction with power.is_power_saving = true, nodes will wake up,
       *   send position, and then sleep for position.position_broadcast_secs seconds.
       */
      TRACKER = 5 [(meshtastic.enum_value_metadata) = {
        label: "Tracker"
        description: "Broadcasts GPS position packets as priority."
      }];

      /*
       * Description: Broadcasts telemetry packets as priority.
       * Technical Details: Telemetry Mesh packets will be prioritized higher and sent more frequently by default.
       *   When used in conjunction with power.is_power_saving = true, nodes will wake up,
       *   send environment telemetry, and then sleep for telemetry.environment_update_interval seconds.
       */
      SENSOR = 6 [(meshtastic.enum_value_metadata) = {
        label: "Sensor"
        description: "Broadcasts telemetry packets as priority."
      }];

      /*
       * Description: Optimized for ATAK system communication and reduces routine broadcasts.
       * Technical Details: Used for nodes dedicated for connection to an ATAK EUD.
       *    Turns off many of the routine broadcasts to favor CoT packet stream
       *    from the Meshtastic ATAK plugin -> IMeshService -> Node
       */
      TAK = 7 [(meshtastic.enum_value_metadata) = {
        label: "TAK"
        description: "Optimized for ATAK system communication, reduces routine broadcasts."
      }];

      /*
       * Description: Device that only broadcasts as needed for stealth or power savings.
       * Technical Details: Used for nodes that "only speak when spoken to"
       *    Turns all of the routine broadcasts but allows for ad-hoc communication
       *    Still rebroadcasts, but with local only rebroadcast mode (known meshes only)
       *    Can be used for clandestine operation or to dramatically reduce airtime / power consumption
       */
      CLIENT_HIDDEN = 8 [(meshtastic.enum_value_metadata) = {
        label: "Client Hidden"
        description: "Device that only broadcasts as needed for stealth or power savings."
      }];

      /*
       * Description: Broadcasts location as message to default channel regularly for to assist with device recovery.
       * Technical Details: Used to automatically send a text message to the mesh
       *    with the current position of the device on a frequent interval:
       *    "I'm lost! Position: lat / long"
       */
      LOST_AND_FOUND = 9 [(meshtastic.enum_value_metadata) = {
        label: "Lost and Found"
        description: "Broadcasts location as message to default channel regularly for to assist with device recovery."
      }];

      /*
       * Description: Enables automatic TAK PLI broadcasts and reduces routine broadcasts.
       * Technical Details: Turns off many of the routine broadcasts to favor ATAK CoT packet stream
       *    and automatic TAK PLI (position location information) broadcasts.
       *    Uses position module configuration to determine TAK PLI broadcast interval.
       */
      TAK_TRACKER = 10 [(meshtastic.enum_value_metadata) = {
        label: "TAK Tracker"
        description: "Enables automatic TAK PLI broadcasts and reduces routine broadcasts."
      }];

      /*
       * Description: Will always rebroadcast packets, but will do so after all other modes.
       * Technical Details: Used for router nodes that are intended to provide additional coverage
       *    in areas not already covered by other routers, or to bridge around problematic terrain,
       *    but should not be given priority over other routers in order to avoid unnecessaraily
       *    consuming hops.
       */
      ROUTER_LATE = 11 [(meshtastic.enum_value_metadata) = {
        label: "Router Late"
        description: "Infrastructure node that always rebroadcasts packets once but only after all other modes. Visible in Nodes list. Not a good choice for rooftop nodes."
      }];

      /*
       * Description: Treats packets from or to favorited nodes as ROUTER_LATE, and all other packets as CLIENT.
       * Technical Details: Used for stronger attic/roof nodes to distribute messages more widely
       *    from weaker, indoor, or less-well-positioned nodes. Recommended for users with multiple nodes
       *    where one CLIENT_BASE acts as a more powerful base station, such as an attic/roof node.
       */
      CLIENT_BASE = 12 [(meshtastic.enum_value_metadata) = {
        label: "Client Base"
        description: "Used for rooftop nodes to distribute messages more widely from multiple nearby client mute nodes."
      }];
    }

    /*
     * Defines the device's behavior for how messages are rebroadcast
     */
    enum RebroadcastMode {
      /*
       * Default behavior.
       * Rebroadcast any observed message, if it was on our private channel or from another mesh with the same lora params.
       */
      ALL = 0 [(meshtastic.enum_value_metadata) = {
        label: "All"
        description: "Rebroadcast any observed message, if it was on our private channel or from another channel with the same lora params."
      }];

      /*
       * Same as behavior as ALL but skips packet decoding and simply rebroadcasts them.
       * Only available in Repeater role. Setting this on any other roles will result in ALL behavior.
       */
      ALL_SKIP_DECODING = 1 [(meshtastic.enum_value_metadata) = {
        label: "All Skip Decoding"
        description: "Same as behavior as ALL but skips packet decoding and simply rebroadcasts them. Only available in Repeater role. Setting this on any other roles will result in ALL behavior."
      }];

      /*
       * Ignores observed messages from foreign meshes that are open or those which it cannot decrypt.
       * Only rebroadcasts message on the nodes local primary / secondary channels.
       */
      LOCAL_ONLY = 2 [(meshtastic.enum_value_metadata) = {
        label: "Local Only"
        description: "Ignores observed messages from foreign meshes that are open or those which it cannot decrypt. Only rebroadcasts message on the nodes local primary / secondary channels."
      }];

      /*
       * Ignores observed messages from foreign meshes like LOCAL_ONLY,
       * but takes it step further by also ignoring messages from nodenums not in the node's known list (NodeDB)
       */
      KNOWN_ONLY = 3 [(meshtastic.enum_value_metadata) = {
        label: "Known Only"
        description: "Ignores observed messages from foreign meshes like Local Only, but takes it step further by also ignoring messages from nodes not already in the node's known list."
      }];

      /*
       * Only permitted for SENSOR, TRACKER and TAK_TRACKER roles, this will inhibit all rebroadcasts, not unlike CLIENT_MUTE role.
       */
      NONE = 4 [(meshtastic.enum_value_metadata) = {
        label: "None"
        description: "Only permitted for SENSOR, TRACKER and TAK_TRACKER roles, this will inhibit all rebroadcasts, not unlike CLIENT_MUTE role."
      }];

      /*
       * Ignores packets from non-standard portnums such as: TAK, RangeTest, PaxCounter, etc.
       * Only rebroadcasts packets with standard portnums: NodeInfo, Text, Position, Telemetry, and Routing.
       */
      CORE_PORTNUMS_ONLY = 5 [(meshtastic.enum_value_metadata) = {
        label: "Core Portnums Only"
        description: "Only rebroadcasts packets from the core portnums: NodeInfo, Text, Position, Telemetry, and Routing."
      }];
    }

    /*
     * Defines buzzer behavior for audio feedback
     */
    enum BuzzerMode {
      /*
       * Default behavior.
       * Buzzer is enabled for all audio feedback including button presses and alerts.
       */
      ALL_ENABLED = 0;

      /*
       * Disabled.
       * All buzzer audio feedback is disabled.
       */
      DISABLED = 1;

      /*
       * Notifications Only.
       * Buzzer is enabled only for notifications and alerts, but not for button presses.
       * External notification config determines the specifics of the notification behavior.
       */
      NOTIFICATIONS_ONLY = 2;

      /*
       * Non-notification system buzzer tones only.
       * Buzzer is enabled only for non-notification tones such as button presses, startup, shutdown, but not for alerts.
       */
      SYSTEM_ONLY = 3;

      /*
       * Direct Message notifications only.
       * Buzzer is enabled only for direct messages and alerts, but not for button presses.
       * External notification config determines the specifics of the notification behavior.
       */
      DIRECT_MSG_ONLY = 4;
    }

    /*
     * Sets the role of node
     */
    Role role = 1 [(meshtastic.field_metadata) = {label: "Device Role"}];

    /*
     * Disabling this will disable the SerialConsole by not initilizing the StreamAPI
     * Moved to SecurityConfig
     */
    bool serial_enabled = 2 [deprecated = true];

    /*
     * For boards without a hard wired button, this is the pin number that will be used
     * Boards that have more than one button can swap the function with this one. defaults to BUTTON_PIN if defined.
     */
    uint32 button_gpio = 4 [(meshtastic.field_metadata) = {
      label: "Button GPIO"
      description: "GPIO pin for the user button, can be remapped on boards with multiple buttons"
    }];

    /*
     * For boards without a PWM buzzer, this is the pin number that will be used
     * Defaults to PIN_BUZZER if defined.
     */
    uint32 buzzer_gpio = 5 [(meshtastic.field_metadata) = {
      label: "Buzzer GPIO"
      description: "GPIO pin for the PWM buzzer"
    }];

    /*
     * Sets the role of node
     */
    RebroadcastMode rebroadcast_mode = 6 [(meshtastic.field_metadata) = {label: "Rebroadcast Mode"}];

    /*
     * Send our nodeinfo this often
     * Defaults to 900 Seconds (15 minutes)
     */
    uint32 node_info_broadcast_secs = 7 [(meshtastic.field_metadata) = {
      label: "Node Info Broadcast Interval"
      description: "How often node information is sent. Defaults to 900 seconds."
      unit: "s"
    }];

    /*
     * Treat double tap interrupt on supported accelerometers as a button press if set to true
     */
    bool double_tap_as_button_press = 8 [(meshtastic.field_metadata) = {
      label: "Double Tap as Button"
      description: "Treat double tap on supported accelerometers as a user button press."
    }];

    /*
     * If true, device is considered to be "managed" by a mesh administrator
     * Clients should then limit available configuration and administrative options inside the user interface
     * Moved to SecurityConfig
     */
    bool is_managed = 9 [deprecated = true];

    /*
     * Disables the triple-press of user button to enable or disable GPS
     */
    bool disable_triple_click = 10 [(meshtastic.field_metadata) = {
      label: "Disable Triple Click"
      description: "Disables the user button triple-press shortcut."
    }];

    /*
     * POSIX Timezone definition string from https://github.com/nayarsystems/posix_tz_db/blob/master/zones.csv.
     */
    string tzdef = 11 [(meshtastic.field_metadata) = {
      label: "Time Zone"
      description: "POSIX timezone definition string"
    }];

    /*
     * If true, disable the default blinking LED (LED_PIN) behavior on the device
     */
    bool led_heartbeat_disabled = 12 [(meshtastic.field_metadata) = {
      label: "LED Heartbeat"
      description: "Controls the blinking LED on the device.  For most devices this will control one of the up to 4 LEDS, the charger and GPS LEDs are not controllable."
    }];

    /*
     * Controls buzzer behavior for audio feedback
     * Defaults to ENABLED
     */
    BuzzerMode buzzer_mode = 13 [(meshtastic.field_metadata) = {since_firmware: "2.7.0"}];
  }

  /*
   * Position Config
   */
  message PositionConfig {
    /*
     * Bit field of boolean configuration options, indicating which optional
     * fields to include when assembling POSITION messages.
     * Longitude, latitude, altitude, speed, heading, and DOP
     * are always included (also time if GPS-synced)
     * NOTE: the more fields are included, the larger the message will be -
     *   leading to longer airtime and a higher risk of packet loss
     */
    enum PositionFlags {
      /*
       * Required for compilation
       */
      UNSET = 0x0000;

      /*
       * Include an altitude value (if available)
       */
      ALTITUDE = 0x0001 [(meshtastic.enum_value_metadata) = {
        label: "Altitude"
        description: "Include an altitude value in position reports, when one is available."
      }];

      /*
       * Altitude value is MSL
       */
      ALTITUDE_MSL = 0x0002 [(meshtastic.enum_value_metadata) = {label: "Altitude is Mean Sea Level"}];

      /*
       * Include geoidal separation
       */
      GEOIDAL_SEPARATION = 0x0004 [(meshtastic.enum_value_metadata) = {label: "Altitude Geoidal Separation"}];

      /*
       * Include the DOP value ; PDOP used by default, see below
       */
      DOP = 0x0008 [(meshtastic.enum_value_metadata) = {
        label: "DOP"
        description: "Include the dilution of precision value. PDOP is used by default."
      }];

      /*
       * If POS_DOP set, send separate HDOP / VDOP values instead of PDOP
       */
      HVDOP = 0x0010 [(meshtastic.enum_value_metadata) = {
        label: "HDOP / VDOP"
        description: "If DOP is set, send separate HDOP and VDOP values instead of PDOP."
      }];

      /*
       * Include number of "satellites in view"
       */
      SATINVIEW = 0x0020 [(meshtastic.enum_value_metadata) = {label: "Number of satellites"}];

      /*
       * Include a sequence number incremented per packet
       */
      SEQ_NO = 0x0040 [(meshtastic.enum_value_metadata) = {label: "Sequence number"}];

      /*
       * Include positional timestamp (from GPS solution)
       */
      TIMESTAMP = 0x0080 [(meshtastic.enum_value_metadata) = {label: "Timestamp"}];

      /*
       * Include positional heading
       * Intended for use with vehicle not walking speeds
       * walking speeds are likely to be error prone like the compass
       */
      HEADING = 0x0100 [(meshtastic.enum_value_metadata) = {label: "Vehicle heading"}];

      /*
       * Include positional speed
       * Intended for use with vehicle not walking speeds
       * walking speeds are likely to be error prone like the compass
       */
      SPEED = 0x0200 [(meshtastic.enum_value_metadata) = {label: "Vehicle speed"}];
    }

    enum GpsMode {
      /*
       * GPS is present but disabled
       */
      DISABLED = 0 [(meshtastic.enum_value_metadata) = {label: "Disabled"}];

      /*
       * GPS is present and enabled
       */
      ENABLED = 1 [(meshtastic.enum_value_metadata) = {label: "Enabled"}];

      /*
       * GPS is not present on the device
       */
      NOT_PRESENT = 2 [(meshtastic.enum_value_metadata) = {label: "Not Present"}];
    }

    /*
     * We should send our position this often (but only if it has changed significantly)
     * Defaults to 15 minutes
     */
    uint32 position_broadcast_secs = 1 [(meshtastic.field_metadata) = {
      label: "Broadcast Interval"
      unit: "s"
      description: "The longest a node will go without broadcasting a position."
    }];

    /*
     * Adaptive position braoadcast, which is now the default.
     */
    bool position_broadcast_smart_enabled = 2 [(meshtastic.field_metadata) = {label: "Smart Position"}];

    /*
     * If set, this node is at a fixed position.
     * We will generate GPS position updates at the regular interval, but use whatever the last lat/lon/alt we have for the node.
     * The lat/lon/alt can be set by an internal GPS or with the help of the app.
     */
    bool fixed_position = 3 [(meshtastic.field_metadata) = {
      label: "Fixed Position"
      description: "The last known latitude, longitude and altitude are broadcast over the mesh on the position interval, rather than a live GPS fix."
    }];

    /*
     * Is GPS enabled for this node?
     */
    bool gps_enabled = 4 [deprecated = true];

    /*
     * How often should we try to get GPS position (in seconds)
     * or zero for the default of once every 30 seconds
     * or a very large value (maxint) to update only once at boot.
     */
    uint32 gps_update_interval = 5 [(meshtastic.field_metadata) = {
      label: "Update Interval"
      unit: "s"
      description: "How often to try to get a GPS position."
    }];

    /*
     * Deprecated in favor of using smart / regular broadcast intervals as implicit attempt time
     */
    uint32 gps_attempt_time = 6 [deprecated = true];

    /*
     * Bit field of boolean configuration options for POSITION messages
     * (bitwise OR of PositionFlags)
     */
    uint32 position_flags = 7 [(meshtastic.field_metadata) = {
      label: "Position Flags"
      description: "Optional fields to include when assembling position messages"
    }];

    /*
     * (Re)define GPS_RX_PIN for your board.
     */
    uint32 rx_gpio = 8 [(meshtastic.field_metadata) = {
      label: "GPS Receive GPIO"
      description: "GPIO pin for GPS RX"
      diy_only: true
    }];

    /*
     * (Re)define GPS_TX_PIN for your board.
     */
    uint32 tx_gpio = 9 [(meshtastic.field_metadata) = {
      label: "GPS Transmit GPIO"
      description: "GPIO pin for GPS TX"
      diy_only: true
    }];

    /*
     * The minimum distance in meters traveled (since the last send) before we can send a position to the mesh if position_broadcast_smart_enabled
     */
    uint32 broadcast_smart_minimum_distance = 10 [(meshtastic.field_metadata) = {
      label: "Minimum Distance"
      unit: "m"
      description: "The minimum change in distance before a smart position broadcast is considered."
    }];

    /*
     * The minimum number of seconds (since the last send) before we can send a position to the mesh if position_broadcast_smart_enabled
     */
    uint32 broadcast_smart_minimum_interval_secs = 11 [(meshtastic.field_metadata) = {
      label: "Minimum Interval"
      unit: "s"
      description: "The shortest interval between position updates once the minimum distance has been met."
    }];

    /*
     * (Re)define PIN_GPS_EN for your board.
     */
    uint32 gps_en_gpio = 12 [(meshtastic.field_metadata) = {
      label: "GPS EN GPIO"
      description: "GPIO pin for GPS enable"
      diy_only: true
    }];

    /*
     * Set where GPS is enabled, disabled, or not present
     */
    GpsMode gps_mode = 13 [(meshtastic.field_metadata) = {label: "GPS Mode"}];
  }

  /*
   * Power Config\
   * See [Power Config](/docs/settings/config/power) for additional power config details.
   */
  message PowerConfig {
    /*
     * Description: Will sleep everything as much as possible, for the tracker and sensor role this will also include the lora radio.
     * Don't use this setting if you want to use your device with the phone apps or are using a device without a user button.
     * Technical Details: Works for ESP32 devices and NRF52 devices in the Sensor or Tracker roles
     */
    bool is_power_saving = 1 [(meshtastic.field_metadata) = {
      label: "Power Saving"
      description: "Will sleep everything as much as possible, for the tracker and sensor role this will also include the lora radio. Don't use this setting if you want to use your device with the phone apps or are using a device without a user button."
    }];

    /*
     *  Description: If non-zero, the device will fully power off this many seconds after external power is removed.
     */
    uint32 on_battery_shutdown_after_secs = 2 [(meshtastic.field_metadata) = {
      label: "Shutdown on Power Loss"
      description: "How long after external power is removed before the device powers off. Zero to disable."
      unit: "s"
    }];

    /*
     * Ratio of voltage divider for battery pin eg. 3.20 (R1=100k, R2=220k)
     * Overrides the ADC_MULTIPLIER defined in variant for battery voltage calculation.
     * https://meshtastic.org/docs/configuration/radio/power/#adc-multiplier-override
     * Should be set to floating point value between 2 and 6
     */
    float adc_multiplier_override = 3 [(meshtastic.field_metadata) = {label: "ADC Override"}];

    /*
     *  Description: The number of seconds for to wait before turning off BLE in No Bluetooth states
     *  Technical Details: ESP32 Only 0 for default of 1 minute
     */
    uint32 wait_bluetooth_secs = 4 [(meshtastic.field_metadata) = {label: "Wait for Bluetooth Duration"}];

    /*
     * Super Deep Sleep Seconds
     * While in Light Sleep if mesh_sds_timeout_secs is exceeded we will lower into super deep sleep
     * for this value (default 1 year) or a button press
     * 0 for default of one year
     */
    uint32 sds_secs = 6;

    /*
     * Description: In light sleep the CPU is suspended, LoRa radio is on, BLE is off an GPS is on
     * Technical Details: ESP32 Only 0 for default of 300
     */
    uint32 ls_secs = 7;

    /*
     * Description: While in light sleep when we receive packets on the LoRa radio we will wake and handle them and stay awake in no BLE mode for this value
     * Technical Details: ESP32 Only 0 for default of 10 seconds
     */
    uint32 min_wake_secs = 8;

    /*
     * I2C address of INA_2XX to use for reading device battery voltage
     */
    uint32 device_battery_ina_address = 9;

    /*
     * If non-zero, we want powermon log outputs.  With the particular (bitfield) sources enabled.
     * Note: we picked an ID of 32 so that lower more efficient IDs can be used for more frequently used options.
     */
    uint64 powermon_enables = 32;
  }

  /*
   * Network Config
   */
  message NetworkConfig {
    enum AddressMode {
      /*
       * obtain ip address via DHCP
       */
      DHCP = 0 [(meshtastic.enum_value_metadata) = {label: "DHCP"}];

      /*
       * use static ip address
       */
      STATIC = 1 [(meshtastic.enum_value_metadata) = {label: "Static"}];
    }

    message IpV4Config {
      /*
       * Static IP address
       */
      fixed32 ip = 1 [(meshtastic.field_metadata) = {label: "IP"}];

      /*
       * Static gateway address
       */
      fixed32 gateway = 2 [(meshtastic.field_metadata) = {label: "Gateway"}];

      /*
       * Static subnet mask
       */
      fixed32 subnet = 3 [(meshtastic.field_metadata) = {label: "Subnet"}];

      /*
       * Static DNS server address
       */
      fixed32 dns = 4 [(meshtastic.field_metadata) = {label: "DNS"}];
    }

    /*
     * Enable WiFi (disables Bluetooth)
     */
    bool wifi_enabled = 1 [(meshtastic.field_metadata) = {
      label: "WiFi Enabled"
      description: "Enabling WiFi will disable the bluetooth connection to the app."
    }];

    /*
     * If set, this node will try to join the specified wifi network and
     * acquire an address via DHCP
     */
    string wifi_ssid = 3 [(meshtastic.field_metadata) = {
      label: "SSID"
      description: "WiFi network name to connect to"
    }];

    /*
     * If set, will be use to authenticate to the named wifi
     */
    string wifi_psk = 4 [(meshtastic.field_metadata) = {
      label: "Password"
      description: "WiFi password for authentication"
    }];

    /*
     * NTP server to use if WiFi is conneced, defaults to `meshtastic.pool.ntp.org`
     */
    string ntp_server = 5 [(meshtastic.field_metadata) = {
      label: "NTP Server"
      description: "NTP server address. Defaults to meshtastic.pool.ntp.org"
    }];

    /*
     * Enable Ethernet
     */
    bool eth_enabled = 6 [(meshtastic.field_metadata) = {
      label: "Ethernet Enabled"
      description: "Enabling Ethernet will disable the bluetooth connection to the app."
    }];

    /*
     * acquire an address via DHCP or assign static
     */
    AddressMode address_mode = 7 [(meshtastic.field_metadata) = {label: "Address Mode"}];

    /*
     * struct to keep static address
     */
    IpV4Config ipv4_config = 8;

    /*
     * rsyslog Server and Port
     */
    string rsyslog_server = 9 [(meshtastic.field_metadata) = {label: "Rsyslog Server"}];

    /*
     * Flags for enabling/disabling network protocols
     */
    uint32 enabled_protocols = 10 [(meshtastic.field_metadata) = {
      label: "Enabled Protocols"
      description: "Enable broadcasting packets via UDP over the local network."
      since_firmware: "2.6.0"
    }];

    /*
     * Enable/Disable ipv6 support
     */
    bool ipv6_enabled = 11 [(meshtastic.field_metadata) = {since_firmware: "2.7.16"}];

    /*
     * Available flags auxiliary network protocols
     */
    enum ProtocolFlags {
      /*
       * Do not broadcast packets over any network protocol
       */
