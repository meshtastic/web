    /*
     * This parameter is for advanced users and licensed HAM radio operators.
     * Ignore Channel Calculation and use this frequency instead. The frequency_offset
     * will still be applied. This will allow you to use out-of-band frequencies.
     * Please respect your local laws and regulations. If you are a HAM, make sure you
     * enable HAM mode and turn off encryption.
     */
    float override_frequency = 14 [(meshtastic.field_metadata) = {label: "Frequency Override"}];

    /*
     * If true, disable the build-in PA FAN using pin define in RF95_FAN_EN.
     */
    bool pa_fan_disabled = 15 [(meshtastic.field_metadata) = {label: "PA Fan Disabled"}];

    /*
     * For testing it is useful sometimes to force a node to never listen to
     * particular other nodes (simulating radio out of range). All nodenums listed
     * in ignore_incoming will have packets they send dropped on receive (by router.cpp)
     */
    repeated uint32 ignore_incoming = 103 [(meshtastic.field_metadata) = {label: "Ignore Incoming"}];

    /*
     * If true, the device will not process any packets received via LoRa that passed via MQTT anywhere on the path towards it.
     */
    bool ignore_mqtt = 104 [(meshtastic.field_metadata) = {
      label: "Ignore MQTT"
      description: "Ignore packets received over LoRa that travelled via MQTT anywhere on their path."
    }];

    /*
     * Sets the ok_to_mqtt bit on outgoing packets
     */
    bool config_ok_to_mqtt = 105 [(meshtastic.field_metadata) = {label: "Ok to MQTT"}];

    /*
     * Set where LORA FEM is enabled, disabled, or not present
     */
    FEM_LNA_Mode fem_lna_mode = 106 [(meshtastic.field_metadata) = {since_firmware: "2.7.20"}];

    /*
     * Don't use radiolib to initialize the radio, instead listen for a serialHal connection
     */
    bool serial_hal_only = 107;
  }

  message BluetoothConfig {
    enum PairingMode {
      /*
       * Device generates a random PIN that will be shown on the screen of the device for pairing
       */
      RANDOM_PIN = 0 [(meshtastic.enum_value_metadata) = {label: "Random Pin"}];

      /*
       * Device requires a specified fixed PIN for pairing
       */
      FIXED_PIN = 1 [(meshtastic.enum_value_metadata) = {label: "Fixed Pin"}];

      /*
       * Device requires no PIN for pairing
       */
      NO_PIN = 2 [(meshtastic.enum_value_metadata) = {label: "No PIN (Just Works)"}];
    }

    /*
     * Enable Bluetooth on the device
     */
    bool enabled = 1 [(meshtastic.field_metadata) = {
      label: "Bluetooth Enabled"
      description: "Enable Bluetooth on the device"
    }];

    /*
     * Determines the pairing strategy for the device
     */
    PairingMode mode = 2 [(meshtastic.field_metadata) = {
      label: "Pairing Mode"
      description: "Bluetooth pairing strategy"
    }];

    /*
     * Specified PIN for PairingMode.FixedPin
     */
    uint32 fixed_pin = 3 [(meshtastic.field_metadata) = {
      label: "Fixed Pin"
      description: "Fixed PIN for Bluetooth pairing. Used when pairing mode is set to fixed PIN"
    }];
  }

  message SecurityConfig {
    /*
     * Controls how the device authenticates remotely received mesh packets.
     */
    enum PacketSignaturePolicy {
      /*
       * Accept unsigned packets for maximum compatibility while still rejecting malformed or invalid signatures.
       * This is the default to avoid legacy nodes dropping signed packets during rebroadcast.
       */
      PACKET_SIGNATURE_POLICY_COMPATIBLE = 0 [(meshtastic.enum_value_metadata) = {
        label: "Compatible - Accept Unsigned"
        description: "Accept unsigned traffic for maximum compatibility. A signature that can be checked and is wrong still drops the packet."
      }];

      /*
       * Prefer authenticated packets while retaining compatibility with unsigned packets from nodes not known to sign.
       * Rejects unsigned, signable broadcasts from nodes that have previously signed.
       */
      PACKET_SIGNATURE_POLICY_BALANCED = 1 [(meshtastic.enum_value_metadata) = {
        label: "Balanced - Prefer Authenticated"
        description: "Prefer authenticated packets, but still accept unsigned traffic from nodes not known to sign."
      }];

      /*
       * Accept only packets authenticated by a verified XEdDSA signature or successful PKI decryption.
       * Unsigned, malformed, invalid, or unverifiable packets are ignored.
       */
      PACKET_SIGNATURE_POLICY_STRICT = 2 [(meshtastic.enum_value_metadata) = {
        label: "Strict - Require Authentication"
        description: "Accept only packets with a verified signature or successful PKI decryption. Packets from older nodes may be ignored."
      }];
    }

    /*
     * The public key of the user's device.
     * Sent out to other nodes on the mesh to allow them to compute a shared secret key.
     */
    bytes public_key = 1 [(meshtastic.field_metadata) = {
      label: "Public Key"
      description: "Generated from your private key and sent out to other nodes on the mesh to allow them to compute a shared secret key"
    }];

    /*
     * The private key of the device.
     * Used to create a shared key with a remote device.
     */
    bytes private_key = 2 [(meshtastic.field_metadata) = {
      label: "Private Key"
      description: "Used to create a shared key with a remote device"
    }];

    /*
     * The public key authorized to send admin messages to this node.
     */
    repeated bytes admin_key = 3 [(meshtastic.field_metadata) = {
      label: "Admin Key"
      description: "The public key authorized to send admin messages to this node"
    }];

    /*
     * If true, device is considered to be "managed" by a mesh administrator via admin messages
     * Device is managed by a mesh administrator.
     */
    bool is_managed = 4 [(meshtastic.field_metadata) = {
      label: "Managed Device"
      description: "Device is managed by a mesh administrator, the user is unable to access any of the device settings."
    }];

    /*
     * Serial Console over the Stream API."
     */
    bool serial_enabled = 5 [(meshtastic.field_metadata) = {
      label: "Serial Console"
      description: "Serial Console over the Stream API."
    }];

    /*
     * By default we turn off logging as soon as an API client connects (to keep shared serial link quiet).
     * Output live debug logging over serial or bluetooth is set to true.
     */
    bool debug_log_api_enabled = 6 [(meshtastic.field_metadata) = {
      label: "Debug Logs"
      description: "Output live debug logging over serial, view and export position-redacted device logs over Bluetooth."
    }];

    /*
     * Allow incoming device control over the insecure legacy admin channel.
     */
    bool admin_channel_enabled = 8;

    /*
     * Determines the packet signature policy applied to remotely received mesh packets.
     */
    PacketSignaturePolicy packet_signature_policy = 9 [(meshtastic.field_metadata) = {since_firmware: "2.8.0"}];
  }

  /*
   * Blank config request, strictly for getting the session key
   */
  message SessionkeyConfig {}

  /*
   * Payload Variant
   */
  oneof payload_variant {
    DeviceConfig device = 1;
    PositionConfig position = 2;
    PowerConfig power = 3;
    NetworkConfig network = 4;
    DisplayConfig display = 5;
    LoRaConfig lora = 6;
    BluetoothConfig bluetooth = 7;
    SecurityConfig security = 8;
    SessionkeyConfig sessionkey = 9;
    DeviceUIConfig device_ui = 10;
  }
}
